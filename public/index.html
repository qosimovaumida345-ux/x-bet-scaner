<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-INTEL CLOUD DASHBOARD</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050510; --card: rgba(15, 15, 35, 0.9); }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 90%; max-width: 450px; text-align: center; }
        .main-card { background: var(--card); border: 2px solid var(--neon); border-radius: 20px; padding: 30px; box-shadow: 0 0 25px rgba(0, 242, 255, 0.2); position: relative; }
        .glitch-title { font-family: 'Orbitron', sans-serif; font-size: 24px; color: var(--neon); text-transform: uppercase; margin-bottom: 25px; letter-spacing: 3px; }
        .id-section input { width: 80%; padding: 12px; background: #000; border: 1px solid #333; color: var(--neon); border-radius: 8px; font-family: 'Orbitron'; text-align: center; margin-bottom: 10px; }
        .id-section button { width: 85%; padding: 12px; background: var(--neon); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        #displayArea { display: none; margin-top: 20px; }
        .prediction-value { font-family: 'Orbitron'; font-size: 80px; font-weight: 900; color: var(--neon); text-shadow: 0 0 20px var(--neon); margin: 15px 0; }
        .live-indicator { font-size: 12px; color: #ff0055; text-transform: uppercase; animation: pulse 1.5s infinite; }
        .confidence-bar { width: 100%; height: 5px; background: #222; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        #fill { height: 100%; width: 0%; background: var(--neon); transition: 0.5s; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <div class="glitch-title">X-Intel Cloud</div>

        <!-- Kirish qismi -->
        <div id="loginSection" class="id-section">
            <input type="text" id="sessionIdInput" placeholder="ENTER SESSION ID...">
            <button onclick="startSession()">Link System</button>
        </div>

        <!-- Natija qismi -->
        <div id="displayArea">
            <div class="live-indicator">● System Synchronized</div>
            <div id="prediction" class="prediction-value">--.--</div>
            <div class="confidence-bar"><div id="fill"></div></div>
            <div id="details" style="display: flex; justify-content: space-between; font-size: 14px; color: #888;">
                <span>CONF: <b id="conf">%0</b></span>
                <span>LAST: <b id="last">0.00</b></span>
            </div>
            <hr style="border: 0.5px solid #222; margin: 20px 0;">
            <button onclick="logout()" style="background:none; color:#555; border:none; cursor:pointer;">Disconnect</button>
        </div>
    </div>
</div>

<script>
    // SERVER MANZILINI BU YERGA QO'YING
    const socket = io('https://x-bet-scaner.onrender.com');
    let currentId = '';

    function startSession() {
        const id = document.getElementById('sessionIdInput').value;
        if(!id) return alert("ID kiriting!");
        
        currentId = id;
        localStorage.setItem('saved_sid', id);
        
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('displayArea').style.display = 'block';

        socket.emit('JOIN_SESSION', id);
    }

    socket.on('UPDATE_UI', (data) => {
        document.getElementById('prediction').innerText = data.coeff + 'x';
        document.getElementById('conf').innerText = '%' + data.conf;
        document.getElementById('last').innerText = data.last || '0.00';
        document.getElementById('fill').style.width = data.conf + '%';
    });

    function logout() {
        localStorage.removeItem('saved_sid');
        location.reload();
    }

    // Avtomatik kirish
    window.onload = () => {
        const saved = localStorage.getItem('saved_sid');
        if(saved) {
            document.getElementById('sessionIdInput').value = saved;
            startSession();
        }
    }
</script>
</body>
</html>
